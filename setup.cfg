[versioneer]
VCS = git
style = pep440
versionfile_source = agent_worker/_version.py
versionfile_build = agent_worker/_version.py
tag_prefix =
parentdir_prefix =
[metadata]
license_files = LICENSE

[mypy]
python_version = 3.11
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True
exclude = (?x)(^agent_worker/_version\.py$)


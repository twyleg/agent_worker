[tox]
requires =
    tox>=4
env_list = type, lint, cli, pytest, docs, py{311}, py{312}, py{313}, py{314}

[testenv]
description = run unit tests
package = wheel
deps =
    -r{toxinidir}/requirements.txt
commands =
    pytest {posargs:tests}

[testenv:pytest]
description = run unit tests

[testenv:docs]
description = build Sphinx documentation
changedir = docs/src
setenv =
    PYTHONPATH = {toxinidir}
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:lint_update]
description = format Python sources
commands =
    black --extend-exclude external/ -l 160 {posargs:.}

[testenv:lint]
description = check Python formatting
commands =
    black --extend-exclude external/ --check -l 160 {posargs:.}

[testenv:type]
description = run type checks
commands =
    mypy {posargs:agent_worker tests}

[testenv:cli]
description = build distributions and smoke-test the installed CLI
commands =
    python -m build --no-isolation --outdir {envtmpdir}/dist
    python -m pip wheel --no-deps --no-cache-dir --wheel-dir {envtmpdir}/isolated-wheels {envtmpdir}/dist/agent_worker-latest.tar.gz
    twine check {envtmpdir}/dist/agent_worker-[0-9]*.tar.gz {envtmpdir}/dist/*.whl
    agent_worker --version
    agent_worker --help
